<div class="center-container">
  <div class="relative w-full max-w-xl p-4 mx-auto mt-6 border-2 bg-dvLightGray-50">
    <h1 class="mb-2">Sign In</h1>
    <p class="mb-4">Sign in to comment on movies and leave recommendations.</p>
    @if (errorMessage) {
      <div class="mb-3 text-red-700" role="alert">{{ errorMessage }}</div>
    }
    @if (providers(); as providers) {
      @for (provider of providers; track provider) {
        <dvoss-button [class]="'dv-button w-full'" class="block w-full mb-3" type="button" (click)="signIn(provider)">
          Continue with {{ providerNames[provider] }}
        </dvoss-button>
      } @empty {
        <p>Sign-in isn't available right now.</p>
      }
    }
  </div>
</div>
