<div class="center-container">
  <div class="relative w-full max-w-xl p-4 mx-auto mt-6 bg-white border-2">
    <h1 class="mb-4">Admin Login</h1>
    <form #form [formGroup]="loginForm" class="flex flex-col gap-4" (ngSubmit)="login()">
      <label class="dv-field">
        <span class="dv-field-label">Username</span>
        <span class="dv-input-wrapper">
          <span class="material-icons dv-input-icon" aria-hidden="true">person</span>
          <input class="dv-input has-icon" name="username" formControlName="username" type="text" autocomplete="username">
        </span>
      </label>
      <label class="dv-field">
        <span class="dv-field-label">Password</span>
        <span class="dv-input-wrapper">
          <span class="material-icons dv-input-icon" aria-hidden="true">lock</span>
          <input class="dv-input has-icon" name="password" formControlName="password" type="password" autocomplete="current-password">
        </span>
      </label>
      @if (errorMessage()) {
        <div class="text-sm dv-field-error" role="alert">{{ errorMessage() }}</div>
      }
      <dvoss-button [class]="'dv-button w-full'" class="w-full" [disabled]="!loginForm.valid" [loading]="submitting()" type="submit">Log In</dvoss-button>
    </form>
  </div>
</div>
